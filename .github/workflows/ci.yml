name: Community CI

on:
  push:
    branches: [master, codex/open-source-preparation]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck:scripts
      - run: npm run lint:tools
      - run: npm run assets:verify
      - name: Release asset gate
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run assets:verify:release
      - run: npm run skills:verify
      - run: npm run package:check
      - name: Public package tree gate
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run package:check:public
      - name: Production dependency advisories
        run: npm run audit:production
      - name: Current-source credential heuristics
        run: node scripts/security/publication-audit.mjs

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Disposable PostgreSQL installation and restore checks
        run: npm run db:verify

  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Isolated production build and HTTP authentication boundaries
        run: npm run security:verify
