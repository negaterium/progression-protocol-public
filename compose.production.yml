# Use explicitly with -f; PostgreSQL is managed separately.
services:
  app:
    image: ${SLS_APP_IMAGE:?Set SLS_APP_IMAGE to a built release tag or digest}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${SLS_APP_PORT:-9999}:9999"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:?Set POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      NODE_ENV: production
      PORT: "9999"
      HOSTNAME: 0.0.0.0
      USE_SECURE_COOKIES: ${USE_SECURE_COOKIES:-true}
      SLS_ENABLE_DEV_AUTH: "false"
      SLS_DEV_USER_ID: ""
      SLS_DEVELOPER_USER_IDS: ${SLS_DEVELOPER_USER_IDS:-}
      SLS_TRUST_PROXY_HEADERS: ${SLS_TRUST_PROXY_HEADERS:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9999/login',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - app-network
networks:
  app-network:
    driver: bridge
